name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dev_build:
        description: "DEV build: يتجاوز فحص النسخة الأصلية (للاختبار فقط - ما ينشر Release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEV_SKIP_LEGIT: ${{ inputs.dev_build && 'true' || 'false' }}
      APK_NAME: BedrockClient-v2.0.${{ github.run_number }}${{ inputs.dev_build && '-DEV' || '' }}
    steps:
      - name: Only the repo owner may make DEV builds
        if: ${{ inputs.dev_build && github.actor != github.repository_owner }}
        run: |
          echo "::error::DEV builds are restricted to the repository owner"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing with release key"
          else
            echo "::warning::KEYSTORE_B64 secret missing - using debug key"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/$APK_NAME.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          retention-days: ${{ inputs.dev_build && 1 || 30 }}

      - name: Publish release
        if: ${{ !inputs.dev_build }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Bedrock Client v2.0.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            ## Bedrock Client v2.0.${{ github.run_number }}
            لانشر خاص لماين كرافت بيدروك (أندرويد) — يشغّل نسختك الأصلية من Google Play.

            **الميزات:** زوم (حقيقي/رقمي) • زر رجوع • HUD قابل للتخصيص (FPS، ساعة، بطارية، رام، مدة اللعب، نص، كروس هير) • إعادة تشغيل اللعبة من شاشة التحميل • لقطة شاشة • أعلى معدل تحديث

            حمّل ملف الـAPK تحت وثبّته.
