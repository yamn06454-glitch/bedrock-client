// Compile-only stub of Minecraft's MainActivity. Never packaged into the APK:
// the real class is loaded at runtime from the installed Minecraft APK.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.mojang.minecraftpe.stub'
    compileSdk 35
    defaultConfig {
        minSdk 28
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
